<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Donat Genduy</title>
<meta name="description" content="Aplikasi kasir & keuangan untuk Donat Genduy" />
<meta name="theme-color" content="#182D51" />

<!-- PWA -->
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Donat Genduy" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- Tailwind (JIT via CDN, tak perlu proses build) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Import map: kasih tau browser lokasi sebenarnya dari "react", "react-dom", dll -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0"
  }
}
</script>

<style>
  html, body { margin: 0; padding: 0; background: #FFF8EA; }
  #root { min-height: 100vh; }
  #boot-loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: #FFF8EA; font-family: system-ui, sans-serif;
    color: #6B7189; text-align: center; padding: 24px; gap: 10px;
  }
  #boot-error {
    display: none; margin-top: 14px; max-width: 480px; text-align: left; background: #FCE8E6;
    color: #B23A2F; border-radius: 12px; padding: 14px; font-size: 12px; white-space: pre-wrap;
    word-break: break-word; font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>
<div id="root">
  <div id="boot-loading">
    <div>Memuat Donat Genduy…</div>
    <div id="boot-slow" style="display:none; font-size: 13px;">
      Kelamaan ya? Coba refresh halaman ini sekali lagi.<br/>
      Kalau masih macet, screenshot kotak merah di bawah ini (kalau muncul) dan kirim ke Claude.
    </div>
    <div id="boot-error"></div>
  </div>
</div>

<script>
  setTimeout(() => {
    const el = document.getElementById("boot-slow");
    if (el) el.style.display = "block";
  }, 6000);

  function showBootError(msg) {
    const box = document.getElementById("boot-error");
    if (!box) return;
    box.style.display = "block";
    box.textContent = "Detail error:\n" + msg;
  }
  window.addEventListener("error", (e) => showBootError((e && e.message) || String(e)));
  window.addEventListener("unhandledrejection", (e) => showBootError((e && e.reason && (e.reason.message || e.reason)) || String(e)));
</script>

<!-- App sudah di-precompile (bukan JSX mentah) supaya tidak bergantung pada proses transpile di HP -->
<script type="module" src="./app.compiled.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
